<!doctype html>
<html lang="fr">
<head>
<meta charset="UTF-8" />
<title>A11yscan</title>
<style>
  :root {
    color-scheme: light dark;
    --accent: #4f46e5;
    --accent-light: #6366f1;
    --accent-dark: #4338ca;
    --fg: #1a1a1a;
    --fg-muted: #6b7280;
    --bg: #ffffff;
    --card-bg: #f8f8fc;
    --border: #e5e7eb;
    --good: #16a34a;
    --warn: #d97706;
    --bad: #dc2626;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --fg: #f0f0f0;
      --fg-muted: #9ca3af;
      --bg: #1c1c22;
      --card-bg: #24242c;
      --border: #333338;
    }
  }
  * { box-sizing: border-box; }
  body {
    font-family: -apple-system, "Segoe UI", system-ui, sans-serif;
    width: 300px;
    margin: 0;
    padding: 16px;
    color: var(--fg);
    background: var(--bg);
  }
  .header { display: flex; align-items: center; gap: 10px; margin-bottom: 14px; }
  .header img { width: 28px; height: 28px; border-radius: 8px; }
  .header h1 { font-size: 1.05em; margin: 0; font-weight: 700; }

  .url-chip {
    font-size: 0.78em;
    color: var(--fg-muted);
    background: var(--card-bg);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 7px 10px;
    margin-bottom: 12px;
    word-break: break-all;
    line-height: 1.4;
  }

  .last-score {
    display: none;
    align-items: center;
    gap: 8px;
    font-size: 0.82em;
    color: var(--fg-muted);
    background: var(--card-bg);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 8px 10px;
    margin-bottom: 12px;
  }
  .last-score.visible { display: flex; }
  .last-score .badge { font-weight: 700; font-size: 1.05em; padding: 1px 8px; border-radius: 999px; color: #fff; }
  .last-score .badge.good { background: var(--good); }
  .last-score .badge.warn { background: var(--warn); }
  .last-score .badge.bad { background: var(--bad); }

  button {
    width: 100%;
    padding: 10px 12px;
    font-size: 0.95em;
    font-weight: 600;
    color: #fff;
    background: linear-gradient(135deg, var(--accent-light), var(--accent-dark));
    border: none;
    border-radius: 9px;
    cursor: pointer;
    transition: opacity 0.15s ease, transform 0.1s ease;
  }
  button:hover:not(:disabled) { opacity: 0.92; }
  button:active:not(:disabled) { transform: scale(0.98); }
  button:disabled { cursor: not-allowed; opacity: 0.5; background: var(--fg-muted); }

  #status {
    display: flex;
    align-items: center;
    gap: 8px;
    font-size: 0.82em;
    color: var(--fg-muted);
    margin-top: 12px;
    line-height: 1.4;
    min-height: 1.4em;
  }
  .spinner {
    display: none;
    width: 13px;
    height: 13px;
    border: 2px solid var(--border);
    border-top-color: var(--accent);
    border-radius: 50%;
    flex-shrink: 0;
    animation: spin 0.7s linear infinite;
  }
  .spinner.spinning { display: inline-block; }
  @keyframes spin { to { transform: rotate(360deg); } }
</style>
</head>
<body>
  <div class="header">
    <img src="icons/icon32.png" alt="" />
    <h1>A11yscan</h1>
  </div>
  <p class="url-chip" id="tab-url"></p>
  <div class="last-score" id="last-score">
    <span>Dernier score sur cette page :</span>
    <span class="badge" id="last-score-badge"></span>
  </div>
  <button id="scan-btn">Scanner cette page</button>
  <p id="status"><span class="spinner" id="spinner"></span><span id="status-text"></span></p>
  <script type="module" src="dist/popup.js"></script>
</body>
</html>
